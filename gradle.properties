org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP 2.2.10-2.0.2 — the version AGP 9.4.0 pins — still registers its generated
# sources through the kotlin.sourceSets DSL, which AGP 9's built-in Kotlin rejects
# by default. This is AGP's own documented escape hatch. Remove it once KSP moves
# its source registration to android.sourceSets.
android.disallowKotlinSourceSets=false
